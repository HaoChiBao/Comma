<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comma</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="preconnect" href="https://hyphenate.ai" crossorigin />
    <style>
      /* Palette and spacing follow the Comma sidebar design (S2c). Light only, as designed. */
      @font-face {
        font-family: "Saans";
        src: url("https://hyphenate.ai/_next/static/media/SaansUprightsVF-s.p.2syun8fkh7gq3.woff2?dpl=dpl_EQxQJ6n7PbybBqCGj2AhSnQQGkAb") format("woff2");
        font-style: normal;
        font-weight: 300 900;
        font-display: swap;
      }
      :root {
        --gutter: clamp(10px, 4vw, 16px);
        --ink: #1f1a17;
        --mute: #6b625c;
        --line: #ece7e1;
        --border: #ddd6ce;
        --hover: #f6f1eb;
        --soft: #faf7f3;
        --card: #fcfaf7;
        --accent: #7a1515;
        --accent-hover: #621010;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body { margin: 0; background: #ffffff; color: var(--ink); font: 13px/1.4 "Saans", "Segoe UI", system-ui, sans-serif; }
      button { font: inherit; color: inherit; }
      .ws { display: flex; flex-direction: column; width: 100%; min-width: 0; height: 100%; position: relative; }
      .ws button:focus-visible, .ws-nd:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .mute { color: var(--mute); }
      .small { font-size: 12px; }
      .strong { font-weight: 600; }
      .normal { font-weight: 400; }
      .mono { font-family: Consolas, "SF Mono", monospace; }
      .tabular { font-variant-numeric: tabular-nums; }
      .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px var(--gutter); border-bottom: 1px solid var(--line); }
      .brand-logo { display: block; width: 100px; height: 34px; object-fit: contain; }
      .top-controls { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
      .actor-select select { max-width: 152px; height: 30px; padding: 0 6px; font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--border); border-radius: 4px; }
      .asof-button { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; }
      .caret { font-size: 10px; }
      .asof-menu { position: absolute; right: 16px; top: 48px; z-index: 5; width: 230px; background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 20px rgba(31, 26, 23, 0.12); padding: 6px 0; }
      .asof-item { display: flex; justify-content: space-between; width: 100%; padding: 8px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; }
      .asof-item.on { background: var(--hover); font-weight: 600; }
      .asof-note { margin: 6px 14px 4px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.45; color: var(--mute); }

      .ws-sec { border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; }
      .ws-sec:hover { background: #fff; border-color: #c9bfb4; }
      .ws-prim { border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
      .ws-prim:hover { background: var(--accent-hover); }
      .ws-prim:disabled { opacity: 0.45; cursor: default; background: var(--accent); }
      .ws-quiet { border: 0; border-radius: 4px; background: transparent; cursor: pointer; }
      .ws-quiet:hover { background: var(--hover); color: var(--ink); }
      .ws-row:hover { background: var(--hover) !important; }
      .ws-link { border: 0; background: transparent; color: var(--accent); padding: 2px 0; text-align: left; text-decoration: underline; cursor: pointer; font-size: 12px; }
      .ws-link:hover { color: var(--accent-hover); }
      .ws-link:disabled { opacity: .5; cursor: default; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

      .scroll { flex: 1; min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; }
      .banner { margin: 0; padding: 8px 16px; background: #fbeae8; color: #b42318; border-bottom: 1px solid #f2c9c4; font-size: 12px; }
      .inline-error { margin: 0; padding: 8px 10px; border: 1px solid #f2c9c4; border-radius: 4px; background: #fbeae8; color: #b42318; font-size: 12px; }

      .idle { min-width: 0; padding: 20px var(--gutter); display: flex; flex-direction: column; gap: 16px; }
      .stack-4 { display: flex; flex-direction: column; gap: 4px; }
      .big-ref { font-size: 20px; font-weight: 600; }
      .inspect { height: 36px; }
      .lede { margin: 0; font-size: 12px; line-height: 1.5; color: var(--mute); }
      .flagged { display: flex; flex-direction: column; margin-top: 6px; }
      .section-label { font-size: 12px; font-weight: 600; color: var(--mute); padding-bottom: 6px; }
      .flagged-note { margin: 0; padding: 6px 0; }
      .flagged-row { display: grid; grid-template-columns: 16px 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 38px; padding: 0 6px; margin: 0 -6px; border: 0; border-top: 1px solid #f1ece6; border-radius: 4px; background: transparent; text-align: left; cursor: pointer; }

      .dots { display: block; width: 100%; max-width: 328px; height: auto; }
      .steps { display: flex; flex-direction: column; gap: 10px; }
      .step { display: flex; align-items: center; gap: 10px; }
      @keyframes wsWave { 0%, 100% { opacity: 0.12; } 45% { opacity: 0.95; } }
      .ws-dot { animation: wsWave 1.5s ease-in-out infinite; }
      @keyframes wsPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .ws-pulse { animation: wsPulse 0.9s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .ws-dot, .ws-pulse { animation: none; opacity: 0.6; } }

      .summary { min-width: 0; padding: 16px var(--gutter) 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
      .value { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; margin-top: 2px; }
      .status-line { display: flex; align-items: center; gap: 6px; font-weight: 600; }
      .result-title { margin-top: 4px; }
      .headline { margin: 6px 0 0; line-height: 1.5; }
      .unknown-detail { margin-top: 4px; font-size: 12px; color: var(--mute); }
      .unknown-detail summary { cursor: pointer; }
      .unknown-detail ul { margin: 4px 0 0; padding-left: 18px; }
      .formula-box { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; padding: 8px 10px; background: var(--soft); border-radius: 4px; min-width: 0; }
      .formula-box > span:first-child, .formula-box > .mono { flex: none; }

      .graph-section { min-width: 0; padding: 12px var(--gutter) 8px; border-bottom: 1px solid var(--line); }
      .row-between { display: flex; justify-content: space-between; align-items: center; }
      .graph-toggle { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px; margin-left: -6px; font-size: 12px; font-weight: 600; color: var(--mute); }
      .chev { display: inline-block; width: 10px; }
      .small-button { height: 28px; padding: 0 10px; font-size: 12px; }
      .graph { display: block; width: 100%; height: auto; margin-top: 6px; }
      .ws-nd { cursor: pointer; }
      .ws-nd:hover .ws-vis { fill: var(--tint); }
      .ws-nd:hover .ws-l1 { font-weight: 800; }
      .ws-nd:hover .ws-ring { opacity: 0.35; }
      .graph-detail { display: flex; flex-direction: column; padding-bottom: 6px; }
      .selected-card { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
      .selected-head { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
      .details { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 5px 10px; font-size: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
      .details > span:nth-child(even) { line-height: 1.45; overflow-wrap: anywhere; }
      .hint { margin: 0; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 6px; font-size: 12px; color: var(--mute); }
      .none-linked { margin: 8px 0 0; line-height: 1.5; }

      .trace-section { min-width: 0; padding: 12px var(--gutter) 16px; }
      .timeline { display: flex; flex-direction: column; margin-top: 4px; }
      .event { display: grid; grid-template-columns: 46px 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
      .event > span:first-child { padding-top: 1px; }
      .event-rail { position: relative; display: flex; justify-content: center; height: 100%; min-height: 36px; }
      .event-line { position: absolute; top: 0; bottom: 0; left: 8px; width: 0; border-left: 2px dotted #cfc6bc; }
      .event-dot { position: relative; margin-top: 3px; background: #fff; border-radius: 50%; }
      .event-text { line-height: 1.4; margin-bottom: 12px; }

      .result-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 var(--gutter) 14px; }
      .action { flex: none; height: 32px; padding: 0 14px; font-weight: 600; white-space: nowrap; }
      .note-composer { display: flex; flex-direction: column; gap: 7px; margin: 0 var(--gutter) 14px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); }
      .note-composer label { font-weight: 600; }
      .note-composer p { margin: 0; }
      .note-composer textarea { display: block; width: 100%; min-width: 0; min-height: 84px; resize: vertical; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; line-height: 1.45; }
      .note-composer textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .note-composer-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .note-action { margin: 0 var(--gutter) 14px; }
      .status { margin: 4px 16px; color: var(--mute); font-size: 12px; }
      .notice { margin: 6px 12px; padding: 7px 9px; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; border-radius: 4px; font-size: 12px; }
      .card { margin: 8px 12px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
      .card h3 { margin: 4px 0; font-size: 12px; }
      .card p { margin: 6px 0; }
      .muted { color: var(--mute); font-size: 12px; }
      .evidence { display: block; width: 100%; margin: 6px 0; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); text-align: left; }
      .evidence-head { display: flex; justify-content: space-between; gap: 8px; }
      .amount { font-weight: 600; }
      .badge { display: inline-block; padding: 1px 6px; border-radius: 9px; font-size: 10px; font-weight: 700; }
      .badge.review { background: #f7e3d3; color: #93430d; }
      .badge.unknown { background: #efebe7; color: #6b625c; }
      .badge.supported { background: #dcebe3; color: #2e6b52; }
      .source-text { white-space: pre-wrap; max-height: 240px; overflow: auto; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 4px; font: 12px/1.45 Consolas, "SF Mono", monospace; }
      .facts { padding-left: 18px; font-size: 12px; }

      @media (max-width: 420px) {
        .top { align-items: flex-start; }
        .top-controls { width: 100%; justify-content: space-between; }
        .actor-select { flex: 1 1 0; min-width: 0; }
        .actor-select select { width: 100%; max-width: none; }
        .asof-menu { left: var(--gutter); right: var(--gutter); width: auto; }
        .formula-box { flex-wrap: wrap; }
        .formula-box > .mono { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
        .formula-box > .ellipsis { flex: 1 1 100%; }
        .row-between { align-items: flex-start; flex-wrap: wrap; gap: 4px; }
        .small-button { padding: 0 7px; }
      }
      @media (max-width: 340px) {
        .top, .idle, .summary, .graph-section, .trace-section { padding-left: 10px; padding-right: 10px; }
        .flagged-row { grid-template-columns: 14px 24px minmax(0, 1fr) auto; gap: 5px; }
        .event { grid-template-columns: 38px 14px minmax(0, 1fr) auto; gap: 4px; }
        .details { grid-template-columns: 66px minmax(0, 1fr); gap: 5px 7px; }
        .action { flex: 1 1 100%; white-space: normal; height: auto; min-height: 32px; padding: 6px 8px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
